# Server and JSP view configuration
server.port=${SERVER_PORT:8080}
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# Database credentials are supplied by the environment.
# Do not put real passwords in this tracked file.
db.driver=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
db.url=${DB_URL:jdbc:mysql://localhost:3306/ecommjava?createDatabaseIfNotExist=true}
db.username=${DB_USERNAME:}
db.password=${DB_PASSWORD:}

# Hibernate
hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}
hibernate.hbm2ddl.auto=${HIBERNATE_DDL_AUTO:update}
entitymanager.packagesToScan=com.jtspringproject.JtSpringProject

# Keep lazy loading behavior as required by the existing JSP views.
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=${HIBERNATE_ENABLE_LAZY_LOAD_NO_TRANS:true}
