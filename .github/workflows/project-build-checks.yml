name: Project build checks

on:
  push:
    branches: [main]
    paths:
      - 'Projects/BankingPortal-API-main/**'
      - 'Projects/E-commerce-project-springBoot-master/**'
      - 'Projects/inventory-management-system-main/**'
      - 'Projects/Train-Ticket-Reservation-System-master/**'
      - '.github/workflows/project-build-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banking-portal:
    name: Banking Portal API (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Projects/BankingPortal-API-main/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/BankingPortal-API-main/pom.xml -DskipTests package

  ecommerce:
    name: E-commerce application (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: Projects/E-commerce-project-springBoot-master/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/E-commerce-project-springBoot-master/pom.xml -DskipTests package

  inventory:
    name: Inventory desktop app (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: Projects/inventory-management-system-main/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/inventory-management-system-main/pom.xml -DskipTests package

  train-reservation:
    name: Train reservation application (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: Projects/Train-Ticket-Reservation-System-master/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/Train-Ticket-Reservation-System-master/pom.xml -DskipTests package
