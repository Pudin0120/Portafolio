name: Project build checks

on:
  push:
    branches: [main]
    paths:
      - 'Projects/BankingPortal-API-main/**'
      - 'Projects/E-commerce-project-springBoot-master/**'
      - 'Projects/inventory-management-system-main/**'
      - 'Projects/Train-Ticket-Reservation-System-master/**'
      - 'Projects/JavaCodes/**'
      - 'Projects/onlinebookstore-master/**'
      - 'Projects/WeatherApp-Android-master/**'
      - 'Projects/Women-Safety-App-master/**'
      - 'Projects/employer-worker-registration-system-main/**'
      - '.github/workflows/project-build-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banking-portal:
    name: Banking Portal API (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Projects/BankingPortal-API-main/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/BankingPortal-API-main/pom.xml -DskipTests package

  ecommerce:
    name: E-commerce application (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: Projects/E-commerce-project-springBoot-master/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/E-commerce-project-springBoot-master/pom.xml -DskipTests package

  inventory:
    name: Inventory desktop app (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: Projects/inventory-management-system-main/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/inventory-management-system-main/pom.xml -DskipTests package

  train-reservation:
    name: Train reservation application (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: Projects/Train-Ticket-Reservation-System-master/pom.xml
      - name: Compile and package
        run: mvn -B -f Projects/Train-Ticket-Reservation-System-master/pom.xml -DskipTests package

  javac-utilities:
    name: JavaCodes utility compilation (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile reviewed JavaCodes utilities and password demo
        run: |
          mkdir -p "$RUNNER_TEMP/javac-out"
          javac -d "$RUNNER_TEMP/javac-out" Projects/JavaCodes/OpenWeatherMap.java "Projects/JavaCodes/Host-checker.java" "Projects/JavaCodes/passowrd&notes.java" Projects/JavaCodes/CryptoUtilSmokeTest.java
          java -cp "$RUNNER_TEMP/javac-out" CryptoUtilSmokeTest

  onlinebookstore:
    name: Online Bookstore WAR (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: Projects/onlinebookstore-master/pom.xml
      - name: Build WAR
        run: mvn -B -f Projects/onlinebookstore-master/pom.xml -DskipTests package
      - name: Verify password hashing
        run: |
          mkdir -p "$RUNNER_TEMP/bookstore-test"
          javac -d "$RUNNER_TEMP/bookstore-test" Projects/onlinebookstore-master/src/main/java/com/bittercode/util/PasswordUtil.java Projects/onlinebookstore-master/tools/PasswordUtilSmokeTest.java
          java -cp "$RUNNER_TEMP/bookstore-test" com.bittercode.util.PasswordUtilSmokeTest

  weather-android:
    name: Weather Android app (Gradle 7.5 / Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
      - name: Assemble debug APK
        working-directory: Projects/WeatherApp-Android-master
        run: gradle --no-daemon :app:assembleDebug

  women-safety-android:
    name: Women Safety prototype (Gradle 7.5 / Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
      - name: Assemble debug APK
        working-directory: Projects/Women-Safety-App-master
        run: gradle --no-daemon :app:assembleDebug

  employer-worker-system:
    name: Employer Worker Registration (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Projects/employer-worker-registration-system-main/pom.xml
      - name: Compile desktop application
        run: mvn -B -f Projects/employer-worker-registration-system-main/pom.xml -DskipTests package
